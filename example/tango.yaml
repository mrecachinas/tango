# Optional global skin; profiles may override theme.name and individual colors.
# Copy this file to ~/.tango.yaml to use its profiles and theme.
# theme:
#   name: dark # dark (default), light, mono, or auto
#   colors:
#     accent: "#89b4fa"
#     border: "238" # ANSI color number; quote numeric values
# A non-empty NO_COLOR environment variable forces monochrome.

profiles:
  local:
    mongo_url: localhost
    mongo_port: 27017
  staging:
    mongo_url: staging.example.com
    mongo_port: 27017
    mongo_user: readonly
    mongo_password: secret
    mongo_db: myapp
  atlas:
    uri: mongodb+srv://cluster0.example.net/?retryWrites=true
    mongo_user: admin
    auth_source: admin
    refresh_rate: 5
