profiles:
  local:
    mongo_url: localhost
    mongo_port: 27017
  staging:
    mongo_url: staging.example.com
    mongo_port: 27017
    mongo_user: readonly
    mongo_password: secret
    mongo_db: myapp
  atlas:
    uri: mongodb+srv://cluster0.example.net/?retryWrites=true
    mongo_user: admin
    auth_source: admin
    refresh_rate: 5
